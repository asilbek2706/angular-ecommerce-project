<header
  class="fixed top-0 left-0 right-0 w-full z-50 bg-[#040a41]/80 backdrop-blur-md border-b border-slate-800/40 transition-all duration-300"
>
  <div class="max-w-7xl mx-auto px-6 sm:px-8 h-20 flex items-center justify-between gap-4">
    <a routerLink="/" (click)="closeMenu()" class="flex items-center gap-3 group">
      <div
        class="w-9 h-9 rounded-xl bg-linear-to-tr from-violet-600 to-fuchsia-600 flex items-center justify-center shadow-lg shadow-violet-500/20 group-hover:scale-105 group-hover:shadow-fuchsia-500/30 transition-all duration-300"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2.5"
          stroke="currentColor"
          class="w-5 h-5 text-white"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"
          />
        </svg>
      </div>
      <span
        class="text-xl sm:text-2xl font-black tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent group-hover:from-violet-400 group-hover:to-fuchsia-400 transition-colors duration-300"
      >
        PremiumShop
      </span>
    </a>

    <nav class="hidden md:flex items-center gap-3 text-base font-semibold">
      <a
        routerLink="/products"
        routerLinkActive="bg-slate-800/50 text-white border-violet-500/30 shadow-md shadow-violet-500/5"
        [routerLinkActiveOptions]="{ exact: true }"
        class="px-5 py-2.5 rounded-xl text-slate-300 border border-transparent transition-all duration-200 hover:text-white hover:bg-slate-900/40 cursor-pointer hover:-translate-y-0.5"
      >
        Products
      </a>

      <a
        routerLink="/cart"
        routerLinkActive="bg-slate-800/50 text-white border-violet-500/30 shadow-md shadow-violet-500/5"
        class="px-5 py-2.5 rounded-xl text-slate-300 border border-transparent transition-all duration-200 hover:text-white hover:bg-slate-900/40 flex items-center gap-2.5 cursor-pointer hover:-translate-y-0.5"
      >
        <span>Cart</span>
        <span
          class="inline-flex items-center justify-center min-w-5 h-5 px-1.5 text-xs font-bold text-white rounded-md ring-4 transition-all duration-300 shadow-[0_0_10px_rgba(124,58,237,0.3)]"
          [class.bg-violet-600]="cartItemCount() > 0"
          [class.ring-violet-500/20]="cartItemCount() > 0"
          [class.animate-pulse]="cartItemCount() > 0"
          [class.bg-slate-700]="cartItemCount() === 0"
          [class.ring-transparent]="cartItemCount() === 0"
          aria-label="Savatchadagi mahsulotlar soni"
        >
          {{ cartItemCount() }}
        </span>
      </a>
    </nav>

    <button
      (click)="toggleMenu()"
      aria-label="Menyuni ochish"
      class="md:hidden p-2 rounded-xl bg-slate-900/60 border border-slate-800/80 text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all cursor-pointer shadow-inner active:scale-95"
    >
      @if (!isMenuOpen) {
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
          class="w-6 h-6"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
          />
        </svg>
      } @else {
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
          class="w-6 h-6"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      }
    </button>
  </div>

  @if (isMenuOpen) {
    <div
      class="md:hidden border-t border-slate-800/60 bg-[#060814]/95 backdrop-blur-2xl px-6 py-5 space-y-2 absolute left-0 right-0 w-full shadow-2xl transition-all duration-300"
    >
      <a
        routerLink="/products"
        routerLinkActive="bg-slate-800/60 text-white border-violet-500/20"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()"
        class="block px-4 py-3 rounded-xl text-slate-300 font-semibold border border-transparent transition-all hover:bg-slate-900/40 active:bg-slate-800/60"
      >
        Products
      </a>

      <a
        routerLink="/cart"
        routerLinkActive="bg-slate-800/60 text-white border-violet-500/20"
        (click)="closeMenu()"
        class="flex items-center justify-between px-4 py-3 rounded-xl text-slate-300 font-semibold border border-transparent transition-all hover:bg-slate-900/40 active:bg-slate-800/60"
      >
        <span>Cart</span>
        <span
          class="inline-flex items-center justify-center min-w-5 h-5 px-1.5 text-xs font-bold rounded-md"
          [class.bg-violet-600]="cartItemCount() > 0"
          [class.text-white]="cartItemCount() > 0"
          [class.bg-slate-800]="cartItemCount() === 0"
          [class.text-slate-500]="cartItemCount() === 0"
          aria-label="Savatchadagi mahsulotlar soni"
        >
          {{ cartItemCount() }}
        </span>
      </a>
    </div>
  }
</header>
